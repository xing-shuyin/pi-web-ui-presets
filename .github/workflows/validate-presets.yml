name: Validate presets

on:
  push:
    branches: [main]
    paths: ["presets/**", "index.json", "scripts/**", ".github/workflows/validate-presets.yml"]
  pull_request:
    paths: ["presets/**", "index.json", "scripts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-repo.mjs
